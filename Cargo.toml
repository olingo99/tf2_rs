[package]
name = "tf2_rs"
version = "0.1.0"
edition = "2024"
description = "ROS 2 TF2 bindings for Rust using cxx and rclrs"
license = "MIT"
readme = "README.md"
keywords = ["ros2", "tf2", "robotics", "transform"]
categories = ["science::robotics"]

[lib]
name = "tf2_rs"
crate-type = ["rlib"]

[dependencies]
cxx = "1"
thiserror = "1"
rclrs = { git = "https://github.com/micmzr/ros2_rust.git" }
ros-env = "0.2"

[build-dependencies]
cxx-build = "1"
