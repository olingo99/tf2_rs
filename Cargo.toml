[package]
name = "tf2_rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "ROS 2 TF2 bindings for Rust using cxx and rclrs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/olingo99/tf2_rs"
documentation = "https://olingo99.github.io/tf2_rs/"
keywords = ["ros2", "tf2", "robotics", "transform"]
categories = ["science::robotics"]
exclude = [".github/", "docker/", ".dockerignore"]

[lib]
name = "tf2_rs"
crate-type = ["rlib"]

[dependencies]
cxx = "1"
thiserror = "1"
rclrs = "0.8"
ros-env = "0.3"

[build-dependencies]
cxx-build = "1"
